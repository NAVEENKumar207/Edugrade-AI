    <!-- Design System Fallback Stylesheet -->
    <link rel="stylesheet" href="/static/css/reactpy_styles.css"/>
    <script>
        // 1. Immediate Theme Bootstrap
        (function() {
            try {
                var saved = localStorage.getItem('edugrade_theme') || 'light';
                document.documentElement.setAttribute('data-theme', saved);
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();

        // 2. Global Theme Switcher & Synchronizer
        function setGlobalTheme(newTheme) {
            document.documentElement.setAttribute('data-theme', newTheme);
            if (newTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            if (document.body) {
                document.body.setAttribute('data-theme', newTheme);
                if (newTheme === 'dark') {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            }
            var rootEl = document.getElementById('app-root');
            if (rootEl) {
                rootEl.setAttribute('data-theme', newTheme);
                if (newTheme === 'dark') {
                    rootEl.classList.add('dark');
                } else {
                    rootEl.classList.remove('dark');
                }
            }
            try {
                localStorage.setItem('edugrade_theme', newTheme);
            } catch (e) {}
        }

        // 3. Instant UI Toggle Interceptor (Delegated globally)
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('.theme-toggle-btn, .legacy-theme-toggle, [data-theme-toggle], #theme-toggle, #theme-toggle-top');
            if (btn) {
                var current = document.documentElement.getAttribute('data-theme') || (document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                var next = current === 'dark' ? 'light' : 'dark';
                setGlobalTheme(next);
            }
        }, true);

        // 4. Ensure initial body reflects saved theme & keep synced with ReactPy root
        document.addEventListener('DOMContentLoaded', function() {
            var saved = localStorage.getItem('edugrade_theme') || 'light';
            setGlobalTheme(saved);

            var observer = new MutationObserver(function() {
                var appRoot = document.getElementById('app-root');
                if (appRoot) {
                    var isDark = appRoot.classList.contains('dark') || appRoot.getAttribute('data-theme') === 'dark';
                    var currentDark = document.documentElement.classList.contains('dark');
                    if (isDark !== currentDark) {
                        setGlobalTheme(isDark ? 'dark' : 'light');
                    }
                }
            });
            var appRoot = document.getElementById('app-root');
            if (appRoot) {
                observer.observe(appRoot, { attributes: true, attributeFilter: ['class', 'data-theme'] });
            } else {
                var bodyObserver = new MutationObserver(function() {
                    var el = document.getElementById('app-root');
                    if (el) {
                        bodyObserver.disconnect();
                        observer.observe(el, { attributes: true, attributeFilter: ['class', 'data-theme'] });
                    }
                });
                bodyObserver.observe(document.body, { childList: true, subtree: true });
            }
        });

        // 5. Bulk CSV File Picker Auto-Reader
        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'csv-file-picker') {
                var file = e.target.files && e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(evt) {
                        var ta = document.getElementById('csv-raw-textarea');
                        if (ta) {
                            ta.value = evt.target.result;
                            ta.dispatchEvent(new Event('input', { bubbles: true }));
                            ta.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    };
                    reader.readAsText(file);
                }
            }
        });

        // 6. Web Speech API Voice Recognition & Synthesis Bridge
        var currentSpeechLang = 'ta-IN';
        window.setVoiceLang = function(lang) {
            currentSpeechLang = lang;
            var lbl = document.getElementById('voice-lang-label');
            if (lbl) lbl.textContent = lang === 'ta-IN' ? 'தமிழ் (ta-IN)' : 'English (en-IN)';
        };

        window.startVoiceInput = function() {
            var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                return;
            }
            try {
                var recognizer = new SpeechRec();
                recognizer.lang = currentSpeechLang;
                recognizer.interimResults = false;
                recognizer.maxAlternatives = 1;

                var micBtn = document.getElementById('voice-mic-btn');
                if (micBtn) micBtn.classList.add('animate-pulse', 'text-light-primary');

                recognizer.onresult = function(event) {
                    if (event.results && event.results[0] && event.results[0][0]) {
                        var text = event.results[0][0].transcript;
                        var inp = document.getElementById('ai-advisor-input');
                        if (inp) {
                            inp.value = text;
                            inp.dispatchEvent(new Event('input', { bubbles: true }));
                            inp.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    }
                };
                recognizer.onend = function() {
                    if (micBtn) micBtn.classList.remove('animate-pulse', 'text-light-primary');
                };
                recognizer.onerror = function() {
                    if (micBtn) micBtn.classList.remove('animate-pulse', 'text-light-primary');
                };
                recognizer.start();
            } catch (err) {
                console.log("Voice recognition error:", err);
            }
        };

        window.readLatestReplyAloud = function() {
            if (!window.speechSynthesis) {
                return;
            }
            try {
                var msgs = document.querySelectorAll('.ai-reply-text');
                if (!msgs || msgs.length === 0) return;
                var lastMsg = msgs[msgs.length - 1].innerText;
                window.speechSynthesis.cancel();
                var utterance = new SpeechSynthesisUtterance(lastMsg);
                utterance.lang = currentSpeechLang;
                window.speechSynthesis.speak(utterance);
            } catch (err) {
                console.log("Voice synthesis error:", err);
            }
        };

        // 7. Event Delegation for Voice Actions
        document.addEventListener('click', function(e) {
            var mic = e.target.closest('#voice-mic-btn');
            if (mic) {
                window.startVoiceInput();
                return;
            }
            var speak = e.target.closest('#voice-speak-btn');
            if (speak) {
                window.readLatestReplyAloud();
                return;
            }
            var langBtn = e.target.closest('[data-voice-lang]');
            if (langBtn) {
                window.setVoiceLang(langBtn.getAttribute('data-voice-lang'));
                return;
            }
        });
    </script>
