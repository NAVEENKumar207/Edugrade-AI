<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140604" />
      <stop offset="50%" stop-color="#1B0401" />
      <stop offset="100%" stop-color="#0D0302" />
    </linearGradient>

    <!-- Vermilion Laser Accent -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E06" stop-opacity="0" />
      <stop offset="30%" stop-color="#FF3316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF6B54" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF3316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C81E06" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FF3316" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    @keyframes sweep {
      0% { transform: translateX(-960px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(960px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(255, 51, 22, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(255, 107, 84, 0.85)); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes waveMove {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .laser-line {
      animation: sweep 4.5s ease-in-out infinite;
    }
    .brand-title {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .pulse-dot-1 {
      animation: blinkDot 1.8s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-dot-2 {
      animation: blinkDot 2.2s ease-in-out infinite 0.4s;
      transform-origin: center;
    }
    .wave-element {
      animation: waveMove 4s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect x="0" y="0" width="960" height="260" rx="16" fill="url(#bgGrad)" stroke="#3A1C18" stroke-width="1.5" />
  
  <!-- Architectural Grid Backdrop -->
  <rect x="0" y="0" width="960" height="260" rx="16" fill="url(#grid)" />

  <!-- Animated Laser Sweep -->
  <g class="laser-line">
    <rect x="0" y="0" width="400" height="260" fill="url(#laserGrad)" opacity="0.35" />
    <line x1="200" y1="0" x2="200" y2="260" stroke="#FF6B54" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Top Accent Horizon Bar -->
  <rect x="0" y="0" width="960" height="4" fill="#FF3316" filter="url(#softGlow)" />

  <!-- Institutional Tag Badge -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="375" height="26" rx="4" fill="#240A07" stroke="#FF3316" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="13" r="4" fill="#00E5A3" class="pulse-dot-1" />
    <text x="26" y="17" fill="#EAE9E9" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">K.S. RANGASAMY COLLEGE OF TECHNOLOGY</text>
  </g>

  <!-- Live Telemetry Status Pill -->
  <g transform="translate(670, 38)">
    <rect x="0" y="0" width="242" height="26" rx="4" fill="#1B0401" stroke="#3A1C18" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#FF3316" class="pulse-dot-2" />
    <text x="26" y="17" fill="#FF8A75" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">REGULATION 2022 • CBCS 10.0</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(48, 122)">
    <text class="brand-title" x="0" y="0" fill="#FFFFFF" font-size="52">EDUGRADE <tspan fill="#FF3316">AI</tspan></text>
  </g>

  <!-- Subtitle Line -->
  <g transform="translate(48, 155)">
    <text x="0" y="0" fill="#D4D0CF" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">
      Industrial Academic Precision • Academic Digital Twin • Career Intelligence
    </text>
  </g>

  <!-- Bottom Badges / Metrics Row -->
  <g transform="translate(48, 202)">
    <!-- B.Tech CSBS Tag -->
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#240A07" stroke="#FF3316" stroke-width="0.8" />
    <text x="14" y="18" fill="#FF6B54" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">B.TECH CSBS 2024-28</text>

    <!-- Credits -->
    <rect x="175" y="0" width="140" height="28" rx="4" fill="#1E1210" stroke="#6E5A57" stroke-width="0.8" />
    <text x="189" y="18" fill="#EAE9E9" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">164 TOTAL CREDITS</text>

    <!-- Monte Carlo Engine -->
    <rect x="330" y="0" width="170" height="28" rx="4" fill="#1E1210" stroke="#6E5A57" stroke-width="0.8" />
    <text x="344" y="18" fill="#EAE9E9" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">MONTE CARLO TWIN</text>

    <!-- ReactPy Architecture -->
    <rect x="515" y="0" width="175" height="28" rx="4" fill="#1E1210" stroke="#6E5A57" stroke-width="0.8" />
    <text x="529" y="18" fill="#61DAFB" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">REACTPY WEBSOCKETS</text>

    <!-- 100% Tests Passed -->
    <rect x="705" y="0" width="155" height="28" rx="4" fill="#06221E" stroke="#00A878" stroke-width="0.8" />
    <text x="720" y="18" fill="#00E5A3" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">181 TESTS PASSED ✔</text>
  </g>

  <!-- Corner Hairline Crosshairs -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#FF3316" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 948 24 L 936 24 M 936 12 L 936 24" stroke="#FF3316" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 12 236 L 24 236 M 24 248 L 24 236" stroke="#FF3316" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 948 236 L 936 236 M 936 248 L 936 236" stroke="#FF3316" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
